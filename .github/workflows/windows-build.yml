name: Build Windows desktop application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run business workflow tests
        run: python -m unittest discover -s tests -v
      - name: Test and build desktop executable
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NexvantEngineering-Windows
          path: windows/dist/NexvantEngineering.exe
          if-no-files-found: error
          retention-days: 30
